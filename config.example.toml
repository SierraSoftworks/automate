[connections.github]
# A *classic* personal access token, with the `notifications` scope (and `repo`
# to see private repositories' subjects). This cannot be replaced by the App
# below: GitHub's notifications API accepts classic tokens only, and the releases
# workflow reads repositories no installation of yours covers.
api_key = "${{ env.GITHUB_API_KEY }}"

# A GitHub App, used for management calls (enabling auto-merge, approving pull
# requests) so those writes are attributed to the App and scoped to whatever
# repositories each installation grants, rather than to your whole account.
#
# Install it from https://your-automate-host/integrations/github/setup — the
# wizard is admin-gated by default and works exactly like the OAuth "Connect"
# flow. Install it on as many user accounts and organizations as you like;
# personal accounts cannot host an organization-level webhook, so an App is the
# only way to cover them with a single endpoint. Automate keeps track of the
# installations from GitHub's own `installation` events, so installs made
# directly on GitHub are picked up too, and disconnecting one from the admin
# area uninstalls it.
#
# This claims the integration id `github`, which shares a namespace with the
# `[oauth2.*]` provider keys — an `[oauth2.github]` provider alongside this one
# is refused at start-up rather than resolved arbitrarily.
#
# Point the App's webhook at https://your-automate-host/webhooks/github and set
# its webhook secret to the same value as webhooks.github.secret.
# [connections.github.app]
# app_id = "123456"
# slug = "my-automate"  # the App's URL slug, from its public page
# private_key = "${{ env.GITHUB_APP_PRIVATE_KEY }}"
# Who may use the install wizard, evaluated exactly like the OAuth providers'
# acl. Admin-gated when omitted.
# acl = 'true'

[connections.todoist]
# Superseded by per-account connections, which each user manages themselves.
# This is imported once on start-up into the account a single-user installation
# runs as, after which you can delete this section.
api_key = "${{ env.TODOIST_API_KEY }}"

[connections.ynab]
# A YNAB Personal Access Token, created from your YNAB account settings.
api_key = "${{ env.YNAB_API_KEY }}"

[connections.alphavantage]
# An AlphaVantage API key, used by the YNAB stocks workflow to fetch stock
# quotes and currency exchange rates. Claim a free key from
# https://www.alphavantage.co/support/#api-key.
api_key = "${{ env.ALPHAVANTAGE_API_KEY }}"

[oauth2.spotify]
name = "Spotify"
# `jobs` is no longer needed and is ignored if present. Completing an
# authorisation now stores a connection and starts whatever that provider
# drives, which is decided in code alongside the provider so the two cannot
# drift apart.
# The provider key doubles as the integration id, so this is set up at
# /integrations/spotify/setup and its callback stays at /oauth/spotify/callback
# (the redirect URI registered with Spotify).
#
# The wizard is admin-gated by default (you must sign in as an admin to link the
# account). To let other people connect their own account, set an `acl` here. It
# is evaluated like the admin ACL (`client_ip`, `method`, `path`, `headers.*`,
# and, when OIDC is configured and the visitor is signed in, `claims.*`). For
# example, `acl = 'true'` lets anyone connect without signing in.
# acl = 'true'
client_id = "${{ env.SPOTIFY_CLIENT_ID }}"
client_secret = "${{ env.SPOTIFY_CLIENT_SECRET }}"
auth_url = "https://accounts.spotify.com/authorize"
token_url = "https://accounts.spotify.com/api/token"
scopes = [
    "user-library-read",
    "playlist-modify-public",
    "playlist-modify-private"
]
# When this provider's refresh token expires or is revoked, automate raises a
# Todoist reminder (with a link to re-authorize) using the settings below, merged
# Where this workflow files its tasks. Omit `project` to fall back to the Inbox.
# Add `connection = "two-words"` to choose between several linked Todoist
# accounts; with only one connected it is used automatically.
todoist = { project = "Software", section = "Accounts" }


[web]
address = "127.0.0.1:8080"
# Where the SQLite database is kept. The encryption key protecting stored
# credentials lives beside it as "<database>.key" unless you configure one
# explicitly below, so moving the database moves both.
# database = "database.sqlite"
# base_url is used to construct absolute URLs (e.g. the OIDC redirect URI, and the
# re-authorization links in OAuth expiry reminders, which are built from a
# background job that has no incoming request to infer the host from). When
# omitted it is inferred from the incoming request's Host header where possible.
# base_url = 'https://automate.example.com'
# trust_proxy controls whether the X-Forwarded-Proto/X-Forwarded-Host headers are
# trusted when determining the request scheme and host. Only enable this when the
# service runs behind a trusted reverse proxy that sets these headers.
# trust_proxy = true

[web.auth]
# Whether several people may sign in and each keep their own workflows and
# connections. Off by default, so upgrading an existing installation changes
# nothing until you opt in.
# multi_tenant = true

# The account owning everything when no identity provider is configured. Naming
# this after the username you will eventually sign in as means adopting an
# identity provider later leaves your existing workflows where they are.
# local_user = "you@example.com"

# Two independent gates, both evaluated against the same filter surface as the
# legacy [web.admin] acl below. `user_acl` decides who may sign in at all;
# `admin_acl` decides who may administer the installation and impersonate other
# users. When either is omitted it falls back to [web.admin] acl, so an existing
# configuration keeps behaving exactly as it did.
# user_acl = 'true'
# admin_acl = 'claims.email == "you@example.com"'

# The key protecting stored credentials, as base64 or hexadecimal. Generate one
# with: openssl rand -base64 32
# When omitted, a key is generated into a file beside the database on first run
# - back that file up, because without it stored credentials cannot be read.
# secret_key = "${{ env.AUTOMATE_SECRET_KEY }}"

# Keys previously used to encrypt credentials. Values are only ever written with
# the current key, but are read with whichever key sealed them, so a rotated key
# stays listed here until every record that used it has been rewritten.
# previous_secret_keys = []

# [web.auth.oidc] takes the same settings as [web.admin.oidc] below, plus:
# username_claim - the claim identifying the account, which becomes the key
# everything the user owns is stored under. Defaults to "preferred_username",
# falling back to "sub". Choose a claim that does not change: renaming an
# account is a deliberate migration rather than something that happens by itself.

[web.admin]
# Superseded by [web.auth] above, and retained so existing configurations keep
# working. Under this section there is a single gate: passing it grants full
# access, so it governs both signing in and administrator status.
#
# The admin area is denied by default; you must provide an `acl` that evaluates to
# true to grant access. The filter can reference `client_ip`, `method`, `path`,
# `headers.*`, and (when OIDC is configured) validated token claims via `claims.*`.
acl = 'client_ip in ["127.0.0.1"]'

[web.admin.oidc]
# Configures support for OIDC authentication on the Admin API, using the provided
# OIDC endpoint (which should not include the .well-known/openid-configuration suffix).
# The admin SPA runs the Authorization Code request in a popup and the agent
# performs the confidential code exchange (and refreshes) with the client secret;
# the issued ID token is presented by the browser as an `Authorization: Bearer`
# header, never stored as a cookie.
endpoint = 'https://auth.example.com'
client_id = '0000000000000000000000000'
client_secret = '11111111111111111111111111111111111111111111111111'
# Include "offline_access" (where your provider supports/requires it) so a
# refresh token is issued and sessions renew silently instead of ending when
# the ID token expires.
scopes = ['openid', 'profile', 'email', 'offline_access']

[webhooks.azure_monitor]
# filter = 'true'
todoist = { project = "Software", section = "Outages" }

[webhooks.github]
# Add an organization (or repository) webhook in GitHub pointing at
# POST /webhooks/github with a JSON content type. Deliveries are rejected unless
# a secret is configured, because the events it carries drive writes to your
# repositories.
# secret = "xxxxxx"  # Shared secret used to verify the X-Hub-Signature-256 HMAC
#
# Events which move the notifications inbox (issues, pull requests, reviews,
# comments, discussions, releases, security advisories) also schedule a
# debounced fetch of [[workflows.github_notifications]], so notifications are
# collected seconds after something happens instead of on the cron interval. No
# configuration is needed - subscribe the webhook to those events and lower the
# workflow's cron to a safety net.

# Enables GitHub's native auto-merge behaviour on pull requests matching the
# filter, so they merge themselves once their required checks pass. Remove this
# section to disable auto-merge handling entirely. Requires the webhook to
# deliver "Pull requests" events, and connections.github.api_key to hold a token
# with the `repo` scope for the repositories you want to manage.
[webhooks.github.auto_merge]
# filter = 'action == "opened" && author in ["dependabot[bot]", "dependabot-preview[bot]"]'
# Leave an approving review as well, for repositories whose branch protection
# requires one before auto-merge can complete.
# approve = true
# approval_message = "This pull request has been automatically approved because it was raised by a trusted account."
# Repositories which do not have their "Allow auto-merge" setting turned on get a
# one-off reminder task (keyed on the repository, so later pull requests from it
# do not raise more), filed using the settings below merged over the global
# [connections.todoist].
todoist = { project = "Software", section = "Maintenance" }

# Raises a Todoist task when an issue, pull request or repository needs your
# attention. Comments and assignments collapse onto one task per issue/PR (so a
# busy thread does not spam you), while each security alert gets its own. Remove
# this section to disable the behaviour entirely.
#
# NOTE: this overlaps with [[workflows.github_notifications]], which raises its
# own task keyed on the notification thread. Narrow that workflow's filter to
# whatever you do not cover here, or you will get two tasks for the same thread.
#
# Filters can reference: kind ("comment", "assignment", "security_alert"), event,
# action, resolved, repository, repository_owner, repository_name, number, title,
# author, assignee, subject_author (the issue/PR author), body and severity.
[webhooks.github.attention]
# Comments and reviews. Defaults to everything except Dependabot's own
# commentary - add yourself so your own replies do not nag you, and consider
# narrowing it to threads that concern you.
comments = '!(author in ["dependabot[bot]", "dependabot-preview[bot]", "notheotherben"]) && subject_author == "notheotherben"'
# Assignments and unassignments. Defaults to `false`, because only you know
# which account is yours. An unassignment completes the task again.
assignments = 'assignee == "notheotherben"'
# Dependabot, code scanning and secret scanning alerts. Defaults to all of them;
# resolving or dismissing an alert completes its task.
# security_alerts = 'severity in ["critical", "high"]'
todoist = { project = "Hobbies", section = "Open Source" }

[webhooks.grafana]
# secret = "xxxxxx"  # Optional authorization header value for webhook authentication
# filter = 'true'
todoist = { project = "Software", section = "Outages" }

[webhooks.grey]
# secret = "xxxxxx"  # Shared secret used to verify the Grey-Webhook-Signature HMAC
# dashboard_url = "https://grey.example.com"  # Optional link back to the Grey status page
# filter = 'state.healthy == false'  # e.g. only act on entities becoming unhealthy
todoist = { project = "Software", section = "Outages" }

[webhooks.honeycomb]
trusted_secrets = [
    # "xxxxxx"
]
# filter = 'true'
todoist = { project = "Software", section = "Outages" }

[webhooks.sentry]
# Required: Sentry signs every delivery, and the agent refuses to process one it
# cannot verify.
secret = "xxxxxx"
# filter = 'true'
todoist = { project = "Software", section = "Errors" }

[webhooks.tailscale]
# Required: Tailscale signs every delivery, and the agent refuses to process one
# it cannot verify.
secret = "xxxxxx"
# filter = 'true'
todoist = { project = "Software", section = "Security" }

[webhooks.terraform]
# secret = "xxxxxx"
todoist = { project = "Software", section = "Maintenance" }

# The [workflows] section is legacy. On the first start after upgrading, every
# entry below other than github_notifications and github_notifications_cleanup
# is copied into the database and this section stops being read, so you can
# delete it once that has happened. Workflows are managed in the browser, or
# through the import and export endpoints, from then on; editing them here has
# no effect, and an edit made in the browser is never overwritten from here.
[[workflows.calendars]]
name = "Personal"
url = "https://example.com/calendar.ics"
cron = "*/30 * * * *"
priority = 4
todoist = { project = "Life", section = "Plans" }

[[workflows.github_notifications]]
# When the GitHub webhook is wired up this only needs to be a safety net for
# missed or undelivered events; without it, drop the interval back to "*/15 * * * *".
cron = "0 * * * *"
todoist = { project = "Hobbies", section = "Open Source" }

[[workflows.github_releases]]
repository = "hashicorp/vault"
cron = "0 */8 * * *"
filter = "!prerelease && !draft"
todoist = { project = "Hobbies", section = "Software" }

