name: Rust
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

env:
  VERSION: "0.0.0-dev"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_NAME: automate

concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deduplicate:
    name: Check CI Result
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      cache-hit: ${{ steps.success.outputs.cache-hit }}
      fingerprint: ${{ steps.fingerprint.outputs.tree }}

    steps:
      - name: Check out merge result
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Fingerprint merge result
        id: fingerprint
        if: github.event_name == 'pull_request'
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Find successful result
        id: success
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .ci-success
          key: rust-ci-v1-${{ steps.fingerprint.outputs.tree }}
          lookup-only: true

  version:
    name: Start Release
    runs-on: ubuntu-latest
    needs: deduplicate
    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Generate Package Version (Release Tag)
        shell: pwsh
        if: github.event_name == 'release'
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$('${{ github.event.release.tag_name }}'.substring(1))"

      - name: Set Package Version
        run: sed -i "s/^version\s*=\s*\".*\"/version = \"$VERSION\"/g" agent/Cargo.toml

      - name: Stash Versioned Cargo.toml
        uses: actions/upload-artifact@v7
        with:
          name: cargofile
          path: agent/Cargo.toml

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: deduplicate

    permissions:
      contents: read

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: cargo install grcov
        uses: SierraSoftworks/setup-grcov@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: cargo test --no-fail-fast
        env:
            RUSTFLAGS: -Cinstrument-coverage
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: grcov
        run: grcov . --binary-path target/debug/deps/ -s . -t lcov --ignore-not-existing --ignore '../**' --ignore '/*' --ignore 'C:/' -o ./lcov.info

      - name: codecov upload
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./lcov.info

  ui:
    name: Build UI
    runs-on: ubuntu-latest
    needs: deduplicate

    permissions:
      contents: read

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Trunk
        shell: bash
        run: |
          cargo binstall --no-confirm trunk
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      # E2E specs use `?demo` for deterministic integration fixtures. Demo mode
      # is deliberately compiled out of release bundles, so preserve a debug
      # bundle for that job before producing the release artifact below.
      - name: Build UI for E2E
        working-directory: ui
        run: trunk build

      - name: Upload E2E UI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist-e2e
          path: ui/dist

      - name: Build release UI
        working-directory: ui
        run: trunk build --release

      - name: Upload release UI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    needs:
      - deduplicate
      - ui

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # The UI is embedded into the agent by `include_dir!` at compile time. E2E
      # uses the debug bundle because several specs rely on deterministic `?demo`
      # fixtures, which are deliberately absent from production release builds.
      - name: Fetch E2E UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist-e2e
          path: ui/dist

      - name: cargo build
        run: cargo build -p automate

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      # Only on failure: the report is a few megabytes and there is nothing in it
      # worth keeping for a run where every test passed.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}-release
    runs-on: ${{ matrix.run_on }}

    # id-token lets the symbols action authenticate to the symbol server with
    # this workflow's OIDC identity; contents stays writable for the release
    # asset upload (an explicit permissions block replaces the defaults).
    permissions:
      contents: write
      id-token: write

    needs:
      - deduplicate
      - version
      - ui

    if: github.event_name != 'pull_request' || needs.deduplicate.outputs.cache-hit != 'true'

    strategy:
      matrix:
        include:
          # Windows builds
          - arch: amd64
            os: windows
            run_on: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
            cargo-flags: "-p automate"

          # Linux builds
          - arch: amd64
            run_on: ubuntu-24.04
            os: linux
            target: x86_64-unknown-linux-musl
            test: true
            cargo-flags: "-p automate --features openssl-vendored"
            setup: |
              sudo apt update && sudo apt install -y musl-tools
          - arch: "arm64"
            os: linux
            run_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cargo-flags: "-p automate --features openssl-vendored"
            setup: |
              sudo apt update && sudo apt install -y musl-tools

          # Apple MacOS builds
          - arch: amd64
            run_on: macos-latest
            os: darwin
            target: x86_64-apple-darwin
            cargo-flags: "-p automate --features openssl-vendored"
          - arch: arm64
            run_on: macos-latest
            os: darwin
            target: aarch64-apple-darwin
            cargo-flags: "-p automate --features openssl-vendored"

    steps:
      - name: Run setup script
        if: matrix.setup
        run: ${{ matrix.setup }}
        
      - name: Check out code
        uses: actions/checkout@v7

      - name: Get Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Install protoc
        uses: SierraSoftworks/setup-protoc@v3.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Fetch Versioned Cargo.toml
        uses: actions/download-artifact@v8
        with:
          name: cargofile
          path: agent

      - name: Fetch UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: cargo build
        env:
          # Line tables in release builds so published symbols carry source
          # attribution; PR/push builds keep the default (no debug info).
          CARGO_PROFILE_RELEASE_DEBUG: ${{ github.event_name == 'release' && '1' || 'false' }}
          # Static musl links don't emit a GNU build-id note by default; the
          # symbols pipeline keys everything off it.
          RUSTFLAGS: ${{ matrix.os == 'linux' && '-C link-arg=-Wl,--build-id=sha1' || '' }}
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo-flags }}

      # Publish debug symbols to symbols.sierrasoftworks.com (build ID derived
      # server-side; authenticated with this workflow's OIDC id-token) so
      # Pyroscope's symbolizer and debuggers can resolve production frames.
      # On Linux and macOS the action re-strips the binary after splitting the
      # symbols out, so release assets keep their usual size.
      - name: Publish debug symbols
        uses: SierraSoftworks/symbols@v1
        if: github.event_name == 'release'
        with:
          binary: target/${{ matrix.target }}/release/${{ env.APP_NAME }}${{ matrix.extension }}
          version: ${{ github.event.release.tag_name }}

      - name: Upload GitHub Release Artifacts
        uses: SierraSoftworks/gh-releases@v1.0.10
        if: github.event_name == 'release'
        with:
          files: "target/${{ matrix.target }}/release/${{ env.APP_NAME }}${{ matrix.extension }} | ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: "true"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}
          path: target/${{ matrix.target }}/release/${{ env.APP_NAME }}${{ matrix.extension }}

  ci:
    name: CI
    runs-on: ubuntu-latest

    needs:
      - deduplicate
      - version
      - test
      - ui
      - e2e
      - build

    if: always()

    permissions:
      contents: read

    steps:
      - name: Verify CI result
        env:
          CACHE_HIT: ${{ needs.deduplicate.outputs.cache-hit }}
          DEDUPLICATE_RESULT: ${{ needs.deduplicate.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          TEST_RESULT: ${{ needs.test.result }}
          UI_RESULT: ${{ needs.ui.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "This merge tree has already passed CI."
            exit 0
          fi

          failed=0
          for job in \
            "Check CI Result=$DEDUPLICATE_RESULT" \
            "Start Release=$VERSION_RESULT" \
            "Test=$TEST_RESULT" \
            "Build UI=$UI_RESULT" \
            "End-to-End Tests=$E2E_RESULT" \
            "Build=$BUILD_RESULT"
          do
            name="${job%%=*}"
            result="${job#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$name completed with result '$result'."
              failed=1
            fi
          done

          exit "$failed"

      - name: Create success marker
        if: github.event_name == 'pull_request' && needs.deduplicate.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-success
          echo "${{ needs.deduplicate.outputs.fingerprint }}" > .ci-success/merge-tree

      - name: Save successful result
        if: github.event_name == 'pull_request' && needs.deduplicate.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .ci-success
          key: rust-ci-v1-${{ needs.deduplicate.outputs.fingerprint }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - build

    if: github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: set environment variables
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Pull in platform artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ env.PLATFORM_PAIR }}

      - name: mark artifact as executable
        run: |
          chmod +x ${{ env.APP_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=Backup your GitHub repositories and releases automatically

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs:
      - docker-build

    if: github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: set environment variables
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          image="$(echo $image | tr '[:upper:]' '[:lower:]')"
          echo "FULL_IMAGE_NAME=${image}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs:
      - build
    steps:
      - name: Update Homebrew Tap
        uses: SierraSoftworks/actions-tap@v1
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aliases: major minor